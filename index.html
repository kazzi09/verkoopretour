<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Retour Registratie - Cloud</title>
<style>
:root{--brand:#1d4ed8;--brand-dark:#17365d;--brand-grad:linear-gradient(135deg,#17365d 0%,#1d4ed8 60%,#3b82f6 100%);--bg:#eef2f7;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--green:#16a34a;--green-soft:#dcfce7;--red:#dc2626;--red-soft:#fee2e2;--radius:14px;--shadow:0 1px 3px rgba(15,23,42,.08),0 8px 24px rgba(15,23,42,.06)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.header{background:var(--brand-grad);color:#fff;padding:22px 16px 64px;text-align:center}
.header h1{font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px}
.header p{margin-top:5px;font-size:14px;opacity:.85}
.cloud-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700;margin-top:8px}
.cloud-badge .dot{width:8px;height:8px;border-radius:50%;background:#fbbf24;animation:blink 1.5s infinite}
.cloud-badge .dot.online{background:#4ade80;animation:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;max-width:900px;margin:-38px auto 0;padding:0 14px;position:relative;z-index:2}
.stat{flex:1;min-width:140px;max-width:280px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;display:flex;align-items:center;gap:12px}
.stat .ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;background:#dbeafe}
.stat:nth-child(2) .ico{background:var(--green-soft)}
.stat:nth-child(3) .ico{background:#fef3c7}
.stat .num{font-size:22px;font-weight:800;line-height:1.1}
.stat .lbl{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.container{max-width:900px;margin:18px auto 40px;padding:0 14px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.card h2{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:800;color:var(--brand-dark);padding-bottom:12px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.step{width:26px;height:26px;border-radius:8px;background:var(--brand);color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center}
label{display:block;font-size:13px;font-weight:700;color:#334155;margin:14px 0 6px}
label:first-of-type{margin-top:0}
input,select,textarea{width:100%;min-height:48px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:16px;font-family:inherit;color:var(--ink);background:#fff}
textarea{min-height:88px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(29,78,216,.15)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.search-box{position:relative}
.results{position:absolute;z-index:50;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1.5px solid var(--line);border-radius:12px;max-height:280px;overflow-y:auto;box-shadow:0 12px 32px rgba(15,23,42,.16);display:none}
.results.open{display:block}
.result-item{padding:13px 14px;cursor:pointer;border-bottom:1px solid #f1f5f9}
.result-item:hover{background:#eff6ff}
.result-code{font-weight:800;color:var(--brand);font-size:14px}
.result-name{font-size:13px;color:#334155;margin-top:2px}
.result-none{padding:14px;color:var(--muted);font-size:14px;text-align:center}
.selected{display:none;margin-top:8px;padding:12px 14px;border-radius:10px;background:var(--green-soft);border:1.5px solid #86efac;color:#14532d;font-size:14px;align-items:center;justify-content:space-between;gap:10px}
.selected.show{display:flex}
.selected .clear{border:none;background:none;cursor:pointer;font-size:18px;color:#14532d;opacity:.6;padding:6px}
.btn{width:100%;min-height:50px;border:none;border-radius:12px;padding:14px 18px;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.98)}
.btn-add{background:var(--green);color:#fff;margin-top:16px}
.btn-save{background:var(--brand-grad);color:#fff;box-shadow:0 6px 16px rgba(29,78,216,.35)}
.btn-new{background:#f1f5f9;color:#334155;border:1.5px solid var(--line)}
.btn-export{background:#fff;color:var(--green);border:1.5px solid #86efac}
.btn-delete{background:var(--red-soft);color:var(--red);border:none;border-radius:9px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;min-height:40px;font-family:inherit;margin-top:10px}
.product-card{border:1.5px solid var(--line);border-left:5px solid var(--brand);border-radius:12px;padding:14px;margin-top:12px;background:#fbfdff}
.product-card h3{font-size:15px;margin-bottom:6px}
.product-card p{font-size:13.5px;color:#334155;margin:3px 0}
.empty{text-align:center;color:var(--muted);padding:26px 16px;font-size:14.5px;border:1.5px dashed var(--line);border-radius:12px;margin-top:12px}
.empty .big{font-size:30px;display:block;margin-bottom:6px}
.retour-card{border:1.5px solid var(--line);border-left:5px solid var(--green);border-radius:12px;padding:16px;margin-bottom:12px;background:#f0fdf4}
.retour-card h3{font-size:16px;color:var(--brand-dark)}
.badge{display:inline-block;background:#dbeafe;color:#1e40af;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;margin-top:4px}
.retour-card p{font-size:14px;color:#334155;margin:5px 0}
.retour-card ul{margin:6px 0 4px 18px;font-size:14px}
.retour-card li{margin:3px 0}
.meta{font-size:12px;color:var(--muted);margin-top:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,80px);background:#0f172a;color:#fff;padding:14px 22px;border-radius:12px;font-size:14.5px;font-weight:700;opacity:0;transition:transform .3s,opacity .3s;z-index:100;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast.ok{background:var(--green)}
.toast.err{background:var(--red)}
.actions{display:grid;gap:10px}
.sync-indicator{position:fixed;top:12px;right:12px;z-index:200;display:flex;align-items:center;gap:6px;background:#fff;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;box-shadow:var(--shadow)}
.sync-indicator .dot{width:8px;height:8px;border-radius:50%}
.sync-indicator.syncing .dot{background:#fbbf24;animation:blink 1s infinite}
.sync-indicator.synced .dot{background:#4ade80}
.sync-indicator.error .dot{background:#f87171}
@media (min-width:640px){.actions{grid-template-columns:2fr 1fr 1fr}}
@media (max-width:600px){.header{padding:18px 14px 58px}.header h1{font-size:20px}.row{grid-template-columns:1fr}.card{padding:16px}.stat{min-width:calc(50% - 5px);padding:12px}.stat .num{font-size:19px}}
</style>
</head>

function parseData(data){
  var lines = data.split("\n");
  var result = [];
  for(var i=0;i<lines.length;i++){
    var line = lines[i];
    if(!line.trim()) continue;
    var idx = line.indexOf("\t");
    if(idx === -1) continue;
    var code = line.substring(0, idx).trim();
    var name = line.substring(idx+1).trim();
    if(code) result.push({code:code, name:name});
  }
  return result;
}

function normalize(text){
  if(!text) return "";
  var s = String(text).toLowerCase();
  s = s.replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ş/g,"s").replace(/ı/g,"i")
       .replace(/ö/g,"o").replace(/ç/g,"c").replace(/â/g,"a").replace(/î/g,"i")
       .replace(/û/g,"u").replace(/ë/g,"e").replace(/é/g,"e").replace(/è/g,"e")
       .replace(/ê/g,"e").replace(/á/g,"a").replace(/à/g,"a").replace(/ó/g,"o")
       .replace(/ò/g,"o").replace(/ú/g,"u").replace(/ù/g,"u").replace(/ñ/g,"n")
       .replace(/ß/g,"ss").replace(/&/g,"en");
  try { s = s.normalize("NFD").replace(/[\u0300-\u036f]/g,""); } catch(e){}
  return s;
}

function escapeHtml(text){
  if(!text) return "";
  return String(text).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
         .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

}

function setupSearch(inputEl, resultsEl, selectedEl, source, onSelect, onClear){
  var activeIndex = -1;
  function close(){ resultsEl.classList.remove("open"); resultsEl.innerHTML=""; activeIndex=-1; }

  inputEl.addEventListener("input", function(){
    var query = normalize(this.value).trim();
    onClear();
    selectedEl.classList.remove("show");
    selectedEl.innerHTML = "";
    resultsEl.innerHTML = "";
    activeIndex = -1;
    if(!query){ close(); return; }

    var found = [];
    for(var i=0; i<source.length && found.length<40; i++){
      var item = source[i];
      if(normalize(item.code).indexOf(query) !== -1 || normalize(item.name).indexOf(query) !== -1){
        found.push(item);
      }
    }

    if(!found.length){
      resultsEl.innerHTML = '<div class="result-none">Bulunamadı.</div>';
      resultsEl.classList.add("open");
      return;
    }

    var html = "";
    for(var j=0; j<found.length; j++){
      html += '<div class="result-item" data-idx="'+j+'"><div class="result-code">'+escapeHtml(found[j].code)+'</div><div class="result-name">'+escapeHtml(found[j].name)+'</div></div>';
    }
    resultsEl.innerHTML = html;
    resultsEl.classList.add("open");

    var items = resultsEl.querySelectorAll(".result-item");
    for(var k=0; k<items.length; k++){
      (function(idx){
        items[idx].addEventListener("click", function(){ pick(found[idx]); });
      })(k);
    }
  });

  inputEl.addEventListener("keydown", function(e){
    var items = resultsEl.querySelectorAll(".result-item");
    if(!items.length) return;
    if(e.key === "ArrowDown"){ e.preventDefault(); activeIndex = Math.min(activeIndex+1, items.length-1); }
    else if(e.key === "ArrowUp"){ e.preventDefault(); activeIndex = Math.max(activeIndex-1, 0); }
    else if(e.key === "Enter"){ e.preventDefault(); if(items[activeIndex]) items[activeIndex].click(); return; }
    else if(e.key === "Escape"){ close(); return; }
    else return;
    for(var i=0;i<items.length;i++){
      if(i===activeIndex) items[i].classList.add("active");
      else items[i].classList.remove("active");
    }
  });

  function pick(item){
    onSelect(item);
    inputEl.value = item.code + " - " + item.name;
    close();
    selectedEl.classList.add("show");
    selectedEl.innerHTML = '<span>✓ <strong>'+escapeHtml(item.code)+'</strong> - '+escapeHtml(item.name)+'</span><button type="button" class="clear">✕</button>';
    selectedEl.querySelector(".clear").addEventListener("click", function(){
      onClear();
      inputEl.value = "";
      selectedEl.classList.remove("show");
      selectedEl.innerHTML = "";
      inputEl.focus();
    });
  }

  return { close: close };
}

setupSearch(elCustomerSearch, elCustomerResults, elSelectedCustomer, customers,
  function(item){ selectedCustomer = item; },
  function(){ selectedCustomer = null; }
);
setupSearch(elArticleSearch, elArticleResults, elSelectedArticle, articles,
  function(item){ selectedArticle = item; },
  function(){ selectedArticle = null; }
);

document.addEventListener("click", function(e){
  if(!e.target.closest(".search-box")){
    elCustomerResults.classList.remove("open");
    elArticleResults.classList.remove("open");
  }
});

function addProduct(){
  if(!selectedArticle){ toast("⚠️ Önce artikel seçin", "err"); return; }
  var aantal = elAantal.value;
  if(!aantal || Number(aantal) <= 0){ toast("⚠️ Aantal girin", "err"); return; }

  retourProducts.push({
    code: selectedArticle.code,
    name: selectedArticle.name,
    aantal: Number(aantal),
    opmerking: elProductOpmerking.value.trim()
  });

  renderProducts();
  selectedArticle = null;
  elArticleSearch.value = "";
  elSelectedArticle.classList.remove("show");
  elSelectedArticle.innerHTML = "";
  elAantal.value = "";
  elProductOpmerking.value = "";
  toast("✓ Artikel eklendi", "ok");
}

function renderProducts(){
  if(!retourProducts.length){
    elProductList.innerHTML = '<div class="empty"><span class="big">📦</span>Henüz artikel yok</div>';
    return;
  }
  var html = "";
  for(var i=0; i<retourProducts.length; i++){
    var p = retourProducts[i];
    html += '<div class="product-card"><h3>'+escapeHtml(p.code)+' - '+escapeHtml(p.name)+'</h3><p><strong>Aantal:</strong> '+p.aantal+' stuks</p>'+(p.opmerking?'<p><strong>Opmerking:</strong> '+escapeHtml(p.opmerking)+'</p>':'')+'<button class="btn-delete" data-idx="'+i+'">🗑 Sil</button></div>';
  }
  elProductList.innerHTML = html;
  var buttons = elProductList.querySelectorAll(".btn-delete");
  for(var j=0; j<buttons.length; j++){
    (function(idx){ buttons[idx].addEventListener("click", function(){ retourProducts.splice(idx,1); renderProducts(); }); })(j);
  }
}

function saveRetour(){
  if(!firebaseReady){
    toast("⚠️ Cloud hazır değil!", "err");
    return;
  }

  var datum = elDatum.value;
  var chauffeur = elChauffeur.value.trim();
  var reden = elRetourreden.value;
  var opmerking = elAlgemeneOpmerking.value.trim();

  if(!datum){ toast("⚠️ Datum girin", "err"); return; }
  if(!chauffeur){ toast("⚠️ Chauffeur girin", "err"); return; }
  if(!selectedCustomer){ toast("⚠️ Klant seçin", "err"); return; }
  if(!reden){ toast("⚠️ Retourreden seçin", "err"); return; }
  if(!retourProducts.length){ toast("⚠️ Artikel ekleyin", "err"); return; }

  setStatus("syncing", "Kaydediliyor...");

  var retourId = Date.now();
  var retour = {
    id: retourId,
    datum: datum,
    chauffeur: chauffeur,
    klantcode: selectedCustomer.code,
    klantnaam: selectedCustomer.name,
    reden: reden,
    algemeneOpmerking: opmerking,
    artikelen: JSON.parse(JSON.stringify(retourProducts)),
    aangemaakt: new Date().toLocaleString("nl-NL"),
    deviceId: DEVICE_ID,
    deviceName: DEVICE_NAME
  };

  db.ref("retours/" + retourId).set(retour)
    .then(function(){
      setStatus("synced", "☁️ Kaydedildi!");
      resetForm(false);
      toast("✓ Cloud'a kaydedildi!", "ok");
    })
    .catch(function(error){
      setStatus("error", "Hata!");
      toast("❌ Hata: " + error.code, "err");
    });
}

function deleteRetour(id){
  if(!confirm("Silmek istediğinize emin misiniz?")) return;
  db.ref("retours/" + id).remove()
    .then(function(){ toast("✓ Silindi", "ok"); })
    .catch(function(error){ toast("❌ Hata: " + error.message, "err"); });
}

function resetForm(confirmUser){
  if(confirmUser && (retourProducts.length || elChauffeur.value || selectedCustomer)){
    if(!confirm("Formu temizle?")) return;
  }
  elDatum.value = new Date().toISOString().slice(0,10);
  elChauffeur.value = "";
  elCustomerSearch.value = "";
  selectedCustomer = null;
  elSelectedCustomer.classList.remove("show");
  elSelectedCustomer.innerHTML = "";
  elRetourreden.value = "";
  elAlgemeneOpmerking.value = "";
  selectedArticle = null;
  elArticleSearch.value = "";
  elSelectedArticle.classList.remove("show");
  elSelectedArticle.innerHTML = "";
  elAantal.value = "";
  elProductOpmerking.value = "";
  retourProducts = [];
  renderProducts();
}

function renderRetours(){
  var retours = retoursData;
  var totaalStuks = 0;
  for(var i=0; i<retours.length; i++){
    if(retours[i].artikelen){
      for(var j=0; j<retours[i].artikelen.length; j++){
        totaalStuks += Number(retours[i].artikelen[j].aantal)||0;
      }
    }
  }
  elStatRetours.textContent = retours.length;
  elStatStuks.textContent = totaalStuks;
  elRetourCount.textContent = retours.length > 0 ? "(" + retours.length + " cloud)" : "";

  if(!retours.length){
    elRetourList.innerHTML = '<div class="empty"><span class="big">🗂️</span>Henüz retour yok</div>';
    return;
  }
  var html = "";
  for(var r=0; r<retours.length; r++){
    var retour = retours[r];
    var artikelen = "";
    if(retour.artikelen){
      for(var a=0; a<retour.artikelen.length; a++){
        var art = retour.artikelen[a];
        artikelen += '<li><strong>'+escapeHtml(art.code)+'</strong> - '+escapeHtml(art.name)+' - '+art.aantal+' stuks</li>';
      }
    }
    var dev = retour.deviceName ? ' <span style="font-size:11px;color:var(--muted)">('+escapeHtml(retour.deviceName)+')</span>' : '';
    html += '<div class="retour-card"><h3>Retour - '+escapeHtml(retour.datum)+dev+'</h3><span class="badge">'+escapeHtml(retour.reden)+'</span><p style="margin-top:10px"><strong>Chauffeur:</strong> '+escapeHtml(retour.chauffeur)+'</p><p><strong>Klant:</strong> '+escapeHtml(retour.klantcode)+' - '+escapeHtml(retour.klantnaam)+'</p><ul>'+artikelen+'</ul>'+(retour.algemeneOpmerking?'<p><strong>Opmerking:</strong> '+escapeHtml(retour.algemeneOpmerking)+'</p>':'')+'<p class="meta">'+escapeHtml(retour.aangemaakt)+'</p><button class="btn-delete btn-del-retour" data-id="'+retour.id+'">🗑 Sil</button></div>';
  }
  elRetourList.innerHTML = html;
  var delButtons = elRetourList.querySelectorAll(".btn-del-retour");
  for(var k=0; k<delButtons.length; k++){
    (function(btn){
      btn.addEventListener("click", function(){ deleteRetour(Number(btn.getAttribute("data-id"))); });
    })(delButtons[k]);
  }
}

function exportCSV(){
  if(!retoursData.length){ toast("Veri yok", "err"); return; }
  var csv = "Datum;Chauffeur;Klant;Reden;Artikel;Aantal\n";
  for(var i=0; i<retoursData.length; i++){
    var r = retoursData[i];
    if(r.artikelen){
      for(var j=0; j<r.artikelen.length; j++){
        var a = r.artikelen[j];
        csv += [r.datum, r.chauffeur, r.klantnaam, r.reden, a.code+" "+a.name, a.aantal].join(";") + "\n";
      }
    }
  }
  var blob = new Blob(["\ufeff"+csv], {type:"text/csv;charset=utf-8;"});
  var url = URL.createObjectURL(blob);
  var link = document.createElement("a");
  link.href = url;
  link.download = "retouren_" + new Date().toISOString().slice(0,10) + ".csv";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
  toast("✓ CSV indirildi", "ok");
}

document.getElementById("btnAddProduct").addEventListener("click", addProduct);
document.getElementById("btnSave").addEventListener("click", saveRetour);
document.getElementById("btnNew").addEventListener("click", function(){ resetForm(true); });
document.getElementById("btnExport").addEventListener("click", exportCSV);

renderProducts();
initFirebase();
</script>
</body>
</html>
