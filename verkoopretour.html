<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retour Registratie</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f3f5f7;
        color: #222;
    }

    .header {
        background: #17365d;
        color: white;
        padding: 18px;
        text-align: center;
    }

    .header h1 {
        margin: 0;
        font-size: 24px;
    }

    .header p {
        margin: 6px 0 0;
        font-size: 14px;
        opacity: .9;
    }

    .container {
        max-width: 850px;
        margin: 20px auto;
        padding: 0 12px 40px;
    }

    .card {
        background: white;
        border-radius: 12px;
        padding: 18px;
        margin-bottom: 16px;
        box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .card h2 {
        margin-top: 0;
        font-size: 18px;
        color: #17365d;
        border-bottom: 1px solid #ddd;
        padding-bottom: 10px;
    }

    label {
        display: block;
        font-weight: bold;
        margin: 12px 0 6px;
    }

    input,
    select,
    textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #bbb;
        border-radius: 8px;
        font-size: 16px;
        background: white;
    }

    textarea {
        resize: vertical;
        min-height: 80px;
    }

    .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .search-box {
        position: relative;
    }

    .results {
        position: absolute;
        left: 0;
        right: 0;
        top: 100%;
        background: white;
        border: 1px solid #bbb;
        border-radius: 0 0 8px 8px;
        max-height: 280px;
        overflow-y: auto;
        z-index: 1000;
        box-shadow: 0 5px 12px rgba(0,0,0,.15);
    }

    .result-item {
        padding: 12px;
        border-bottom: 1px solid #eee;
        cursor: pointer;
    }

    .result-item:hover,
    .result-item:active {
        background: #eef4fb;
    }

    .result-code {
        font-weight: bold;
        color: #17365d;
    }

    .result-name {
        font-size: 14px;
        margin-top: 3px;
    }

    .selected {
        background: #e9f7ef;
        border: 1px solid #51a66d;
        padding: 10px;
        border-radius: 8px;
        margin-top: 8px;
        display: none;
    }

    .selected strong {
        color: #19733a;
    }

    button {
        border: 0;
        border-radius: 8px;
        padding: 13px 18px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .btn-primary {
        width: 100%;
        background: #17365d;
        color: white;
        margin-top: 15px;
    }

    .btn-add {
        width: 100%;
        background: #198754;
        color: white;
        margin-top: 15px;
    }

    .btn-secondary {
        background: #6c757d;
        color: white;
    }

    .btn-danger {
        background: #dc3545;
        color: white;
    }

    .product-list {
        margin-top: 15px;
    }

    .product-card {
        border: 1px solid #ddd;
        border-left: 5px solid #17365d;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 10px;
        background: #fafafa;
    }

    .product-card h3 {
        margin: 0 0 5px;
        font-size: 16px;
    }

    .product-card p {
        margin: 4px 0;
        font-size: 14px;
    }

    .product-card button {
        margin-top: 8px;
        padding: 8px 12px;
        font-size: 13px;
    }

    .photo-preview {
        margin-top: 10px;
        max-width: 180px;
        max-height: 180px;
        border-radius: 8px;
        display: none;
    }

    .retour-card {
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 15px;
        margin-bottom: 12px;
        background: #fff;
    }

    .retour-header {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
    }

    .retour-header strong {
        color: #17365d;
    }

    .small {
        font-size: 13px;
        color: #666;
    }

    .empty {
        text-align: center;
        color: #777;
        padding: 20px;
    }

    .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 15px;
    }

    .success-message {
        display: none;
        background: #d1e7dd;
        color: #0f5132;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 15px;
        font-weight: bold;
    }

    @media (max-width: 600px) {
        .row {
            grid-template-columns: 1fr;
        }

        .container {
            margin-top: 10px;
        }

        .card {
            padding: 14px;
        }

        .header h1 {
            font-size: 21px;
        }

        .actions {
            grid-template-columns: 1fr;
        }
    }
</style>
</head>

<body>

<div class="header">
    <h1>🚚 Retour Registratie</h1>
    <p>Retour eenvoudig registreren</p>
</div>

<div class="container">

    <div id="successMessage" class="success-message">
        Retour is succesvol opgeslagen.
    </div>

    <!-- ALGEMENE GEGEVENS -->
    <div class="card">
        <h2>1. Algemene gegevens</h2>

        <div class="row">
            <div>
                <label for="datum">Datum</label>
                <input type="date" id="datum">
            </div>

            <div>
                <label for="chauffeur">Chauffeur</label>
                <input type="text" id="chauffeur" placeholder="Naam chauffeur">
            </div>
        </div>

        <label>Retourklant</label>

        <div class="search-box">
            <input
                type="text"
                id="customerSearch"
                placeholder="Zoek op klantnummer of klantnaam..."
                autocomplete="off"
            >
            <div id="customerResults" class="results"></div>
        </div>

        <div id="selectedCustomer" class="selected"></div>

        <label for="retourreden">Retourreden</label>

        <select id="retourreden">
            <option value="">-- Selecteer retourreden --</option>
            <option>Verkeerd geleverd</option>
            <option>Verkeerd besteld</option>
            <option>Beschadigd</option>
            <option>Klant weigert</option>
            <option>Te korte THT</option>
            <option>Retour volgens afspraak</option>
            <option>Kwaliteitsprobleem</option>
            <option>Overig</option>
        </select>

        <label for="algemeneOpmerking">Opmerking</label>
        <textarea
            id="algemeneOpmerking"
            placeholder="Eventuele extra informatie..."
        ></textarea>
    </div>


    <!-- ARTIKEL TOEVOEGEN -->
    <div class="card">
        <h2>2. Artikelen retour</h2>

        <label>Artikel zoeken</label>

        <div class="search-box">
            <input
                type="text"
                id="articleSearch"
                placeholder="Zoek op artikelnummer of productnaam..."
                autocomplete="off"
            >
            <div id="articleResults" class="results"></div>
        </div>

        <div id="selectedArticle" class="selected"></div>

        <div class="row">

            <div>
                <label for="aantal">Aantal colli</label>
                <input
                    type="number"
                    id="aantal"
                    min="1"
                    step="1"
                    placeholder="Aantal"
                >
            </div>

            <div>
                <label for="tht">THT-datum</label>
                <input type="date" id="tht">
            </div>

        </div>

        <label for="productOpmerking">Opmerking artikel</label>
        <textarea
            id="productOpmerking"
            placeholder="Bijvoorbeeld: beschadigde verpakking..."
        ></textarea>

        <label for="foto">Foto</label>
        <input
            type="file"
            id="foto"
            accept="image/*"
            capture="environment"
        >

        <img id="photoPreview" class="photo-preview">

        <button class="btn-add" onclick="addProduct()">
            ＋ Artikel toevoegen
        </button>

        <div id="productList" class="product-list">
            <div class="empty">
                Nog geen artikelen toegevoegd.
            </div>
        </div>
    </div>


    <!-- OPSLAAN -->
    <div class="card">
        <h2>3. Retour opslaan</h2>

        <button class="btn-primary" onclick="saveRetour()">
            💾 Retour opslaan
        </button>

        <div class="actions">
            <button class="btn-secondary" onclick="newRetour()">
                ＋ Nieuwe retour
            </button>

            <button class="btn-secondary" onclick="exportCSV()">
                📊 Exporteren
            </button>
        </div>
    </div>


    <!-- OPGESLAGEN RETOUREN -->
    <div class="card">
        <h2>Geregistreerde retouren</h2>

        <div id="retourList">
            <div class="empty">
                Nog geen retouren geregistreerd.
            </div>
        </div>
    </div>

</div>

/* =========================================================
   DATA PARSEN
========================================================= */

function parseData(data) {
    return data
        .trim()
        .split("\n")
        .map(line => {
            const parts = line.split("\t");
            return {
                code: (parts[0] || "").trim(),
                name: parts.slice(1).join("\t").trim()
            };
        });
}

const customers = parseData(CUSTOMER_DATA);
const articles = parseData(ARTICLE_DATA);


/* =========================================================
   VARIABELEN
========================================================= */

let selectedCustomer = null;
let selectedArticle = null;
let retourProducts = [];

let photoData = "";


/* =========================================================
   DATUM
========================================================= */

document.getElementById("datum").value =
    new Date().toISOString().split("T")[0];


/* =========================================================
   NORMALISEREN
========================================================= */

function normalize(text) {
    return String(text || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
}


/* =========================================================
   KLANT ZOEKEN
========================================================= */

const customerSearch = document.getElementById("customerSearch");
const customerResults = document.getElementById("customerResults");

customerSearch.addEventListener("input", function () {

    selectedCustomer = null;

    document.getElementById("selectedCustomer").style.display = "none";

    const query = normalize(this.value.trim());

    customerResults.innerHTML = "";

    if (!query) {
        return;
    }

    const results = customers
        .filter(customer =>
            normalize(customer.code).includes(query) ||
            normalize(customer.name).includes(query)
        )
        .slice(0, 40);

    results.forEach(customer => {

        const div = document.createElement("div");
        div.className = "result-item";

        div.innerHTML = `
            <div class="result-code">${escapeHtml(customer.code)}</div>
            <div class="result-name">${escapeHtml(customer.name)}</div>
        `;

        div.onclick = function () {
            selectCustomer(customer);
        };

        customerResults.appendChild(div);
    });

    if (results.length === 0) {
        customerResults.innerHTML =
            `<div class="result-item">Geen klant gevonden.</div>`;
    }
});


function selectCustomer(customer) {

    selectedCustomer = customer;

    customerSearch.value =
        customer.code + " - " + customer.name;

    customerResults.innerHTML = "";

    const selected = document.getElementById("selectedCustomer");

    selected.style.display = "block";

    selected.innerHTML = `
        <strong>✓ Geselecteerde klant</strong><br>
        ${escapeHtml(customer.code)} - ${escapeHtml(customer.name)}
    `;
}


/* =========================================================
   ARTIKEL ZOEKEN
========================================================= */

const articleSearch = document.getElementById("articleSearch");
const articleResults = document.getElementById("articleResults");

articleSearch.addEventListener("input", function () {

    selectedArticle = null;

    document.getElementById("selectedArticle").style.display = "none";

    const query = normalize(this.value.trim());

    articleResults.innerHTML = "";

    if (!query) {
        return;
    }

    const results = articles
        .filter(article =>
            normalize(article.code).includes(query) ||
            normalize(article.name).includes(query)
        )
        .slice(0, 40);

    results.forEach(article => {

        const div = document.createElement("div");
        div.className = "result-item";

        div.innerHTML = `
            <div class="result-code">${escapeHtml(article.code)}</div>
            <div class="result-name">${escapeHtml(article.name || "Geen productnaam")}</div>
        `;

        div.onclick = function () {
            selectArticle(article);
        };

        articleResults.appendChild(div);
    });

    if (results.length === 0) {
        articleResults.innerHTML =
            `<div class="result-item">Geen artikel gevonden.</div>`;
    }
});


function selectArticle(article) {

    selectedArticle = article;

    articleSearch.value =
        article.code + " - " + article.name;

    articleResults.innerHTML = "";

    const selected = document.getElementById("selectedArticle");

    selected.style.display = "block";

    selected.innerHTML = `
        <strong>✓ Geselecteerd artikel</strong><br>
        ${escapeHtml(article.code)} - ${escapeHtml(article.name)}
    `;
}


/* =========================================================
   FOTO
========================================================= */

document.getElementById("foto").addEventListener("change", function () {

    const file = this.files[0];

    if (!file) {
        photoData = "";
        return;
    }

    const reader = new FileReader();

    reader.onload = function (e) {

        photoData = e.target.result;

        const preview = document.getElementById("photoPreview");

        preview.src = photoData;
        preview.style.display = "block";
    };

    reader.readAsDataURL(file);
});


/* =========================================================
   ARTIKEL TOEVOEGEN
========================================================= */

function addProduct() {

    if (!selectedArticle) {
        alert("Selecteer eerst een artikel.");
        return;
    }

    const aantal = document.getElementById("aantal").value;

    if (!aantal || Number(aantal) <= 0) {
        alert("Vul het aantal colli in.");
        return;
    }

    const tht = document.getElementById("tht").value;

    const opmerking =
        document.getElementById("productOpmerking").value.trim();

    const product = {
        code: selectedArticle.code,
        name: selectedArticle.name,
        aantal: Number(aantal),
        tht: tht,
        opmerking: opmerking,
        foto: photoData
    };

    retourProducts.push(product);

    renderProducts();

    resetProductFields();
}


/* =========================================================
   ARTIKELEN TONEN
========================================================= */

function renderProducts() {

    const list = document.getElementById("productList");

    if (retourProducts.length === 0) {

        list.innerHTML =
            `<div class="empty">Nog geen artikelen toegevoegd.</div>`;

        return;
    }

    list.innerHTML = "";

    retourProducts.forEach((product, index) => {

        const div = document.createElement("div");

        div.className = "product-card";

        let photo = "";

        if (product.foto) {
            photo = `
                <br>
                <img
                    src="${product.foto}"
                    style="
                        max-width:150px;
                        max-height:150px;
                        border-radius:8px;
                    "
                >
            `;
        }

        div.innerHTML = `
            <h3>
                ${escapeHtml(product.code)}
                - ${escapeHtml(product.name)}
            </h3>

            <p><strong>Aantal:</strong> ${product.aantal} colli</p>

            <p>
                <strong>THT:</strong>
                ${product.tht ? formatDate(product.tht) : "-"}
            </p>

            ${
                product.opmerking
                ? `<p><strong>Opmerking:</strong> ${escapeHtml(product.opmerking)}</p>`
                : ""
            }

            ${photo}

            <button
                class="btn-danger"
                onclick="removeProduct(${index})"
            >
                Verwijderen
            </button>
        `;

        list.appendChild(div);
    });
}


/* =========================================================
   ARTIKEL VERWIJDEREN
========================================================= */

function removeProduct(index) {

    if (!confirm("Dit artikel verwijderen?")) {
        return;
    }

    retourProducts.splice(index, 1);

    renderProducts();
}


/* =========================================================
   PRODUCT VELDEN RESETTEN
========================================================= */

function resetProductFields() {

    selectedArticle = null;

    articleSearch.value = "";

    document.getElementById("selectedArticle").style.display = "none";

    document.getElementById("aantal").value = "";

    document.getElementById("tht").value = "";

    document.getElementById("productOpmerking").value = "";

    document.getElementById("foto").value = "";

    photoData = "";

    const preview = document.getElementById("photoPreview");

    preview.src = "";
    preview.style.display = "none";
}


/* =========================================================
   RETOUR OPSLAAN
========================================================= */

function saveRetour() {

    const datum =
        document.getElementById("datum").value;

    const chauffeur =
        document.getElementById("chauffeur").value.trim();

    const retourreden =
        document.getElementById("retourreden").value;

    const algemeneOpmerking =
        document.getElementById("algemeneOpmerking").value.trim();


    if (!datum) {
        alert("Vul de datum in.");
        return;
    }

    if (!chauffeur) {
        alert("Vul de naam van de chauffeur in.");
        return;
    }

    if (!selectedCustomer) {
        alert("Selecteer een klant.");
        return;
    }

    if (!retourreden) {
        alert("Selecteer een retourreden.");
        return;
    }

    if (retourProducts.length === 0) {
        alert("Voeg minimaal één artikel toe.");
        return;
    }


    const retour = {

        id: Date.now(),

        datum: datum,

        chauffeur: chauffeur,

        klantcode: selectedCustomer.code,

        klantnaam: selectedCustomer.name,

        retourreden: retourreden,

        algemeneOpmerking: algemeneOpmerking,

        artikelen: retourProducts,

        aangemaaktOp:
            new Date().toLocaleString("nl-NL")
    };


    const retours = getRetours();

    retours.unshift(retour);

    localStorage.setItem(
        "edex_retours",
        JSON.stringify(retours)
    );


    document.getElementById("successMessage").style.display =
        "block";

    setTimeout(() => {

        document.getElementById("successMessage").style.display =
            "none";

    }, 3000);


    renderRetours();

    newRetour(false);
}


/* =========================================================
   NIEUWE RETOUR
========================================================= */

function newRetour(showConfirm = true) {

    if (
        showConfirm &&
        (
            retourProducts.length > 0 ||
            document.getElementById("chauffeur").value ||
            selectedCustomer
        )
    ) {

        if (!confirm("Huidige retourgegevens wissen?")) {
            return;
        }
    }

    document.getElementById("datum").value =
        new Date().toISOString().split("T")[0];

    document.getElementById("chauffeur").value = "";

    customerSearch.value = "";

    document.getElementById("retourreden").value = "";

    document.getElementById("algemeneOpmerking").value = "";

    selectedCustomer = null;

    document.getElementById("selectedCustomer").style.display =
        "none";

    retourProducts = [];

    resetProductFields();

    renderProducts();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =========================================================
   OPGESLAGEN RETOUREN
========================================================= */

function getRetours() {

    try {

        return JSON.parse(
            localStorage.getItem("edex_retours") || "[]"
        );

    } catch (e) {

        return [];
    }
}


function renderRetours() {

    const container =
        document.getElementById("retourList");

    const retours = getRetours();

    if (retours.length === 0) {

        container.innerHTML =
            `<div class="empty">
                Nog geen retouren geregistreerd.
            </div>`;

        return;
    }

    container.innerHTML = "";

    retours.forEach(retour => {

        const div =
            document.createElement("div");

        div.className = "retour-card";

        let artikelenHtml = "";

        retour.artikelen.forEach(article => {

            artikelenHtml += `
                <li>
                    <strong>${escapeHtml(article.code)}</strong>
                    -
                    ${escapeHtml(article.name)}
                    (${article.aantal} colli)
                </li>
            `;
        });


        div.innerHTML = `

            <div class="retour-header">

                <strong>
                    Retour ${escapeHtml(String(retour.id))}
                </strong>

                <span class="small">
                    ${formatDate(retour.datum)}
                </span>

            </div>

            <hr>

            <p>
                <strong>Chauffeur:</strong>
                ${escapeHtml(retour.chauffeur)}
            </p>

            <p>
                <strong>Klant:</strong>
                ${escapeHtml(retour.klantcode)}
                -
                ${escapeHtml(retour.klantnaam)}
            </p>

            <p>
                <strong>Retourreden:</strong>
                ${escapeHtml(retour.retourreden)}
            </p>

            <p><strong>Artikelen:</strong></p>

            <ul>
                ${artikelenHtml}
            </ul>

            ${
                retour.algemeneOpmerking
                ? `
                    <p>
                        <strong>Opmerking:</strong>
                        ${escapeHtml(retour.algemeneOpmerking)}
                    </p>
                `
                : ""
            }

            <p class="small">
                Geregistreerd: ${escapeHtml(retour.aangemaaktOp)}
            </p>

            <button
                class="btn-danger"
                onclick="deleteRetour(${retour.id})"
            >
                Retour verwijderen
            </button>
        `;

        container.appendChild(div);
    });
}


/* =========================================================
   RETOUR VERWIJDEREN
========================================================= */

function deleteRetour(id) {

    if (!confirm("Deze retour definitief verwijderen?")) {
        return;
    }

    let retours = getRetours();

    retours =
        retours.filter(retour => retour.id !== id);

    localStorage.setItem(
        "edex_retours",
        JSON.stringify(retours)
    );

    renderRetours();
}


/* =========================================================
   CSV EXPORT
========================================================= */

function exportCSV() {

    const retours = getRetours();

    if (retours.length === 0) {
        alert("Er zijn geen retouren om te exporteren.");
        return;
    }

    let csv =
        "Datum;Chauffeur;Klantnummer;Klantnaam;Retourreden;Artikelnummer;Productnaam;Aantal colli;THT;Artikelopmerking;Algemene opmerking\n";


    retours.forEach(retour => {

        retour.artikelen.forEach(article => {

            csv += [
                retour.datum,
                retour.chauffeur,
                retour.klantcode,
                retour.klantnaam,
                retour.retourreden,
                article.code,
                article.name,
                article.aantal,
                article.tht || "",
                article.opmerking || "",
                retour.algemeneOpmerking || ""
            ]
            .map(csvEscape)
            .join(";") + "\n";

        });

    });


    const blob = new Blob(
        ["\ufeff" + csv],
        {
            type: "text/csv;charset=utf-8;"
        }
    );


    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    link.href = url;

    link.download =
        "retouren_" +
        new Date().toISOString().slice(0, 10) +
        ".csv";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    URL.revokeObjectURL(url);
}


function csvEscape(value) {

    value = String(value ?? "");

    if (
        value.includes(";") ||
        value.includes('"') ||
        value.includes("\n")
    ) {
        return '"' +
            value.replace(/"/g, '""') +
            '"';
    }

    return value;
}


/* =========================================================
   HULPFUNCTIES
========================================================= */

function formatDate(dateString) {

    if (!dateString) {
        return "-";
    }

    const parts =
        dateString.split("-");

    if (parts.length !== 3) {
        return dateString;
    }

    return (
        parts[2] +
        "-" +
        parts[1] +
        "-" +
        parts[0]
    );
}


function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   BUITEN KLIKKEN = ZOEKRESULTATEN SLUITEN
========================================================= */

document.addEventListener("click", function (event) {

    if (!event.target.closest(".search-box")) {

        customerResults.innerHTML = "";
        articleResults.innerHTML = "";

    }

});


/* =========================================================
   START
========================================================= */

renderProducts();
renderRetours();

</script>
